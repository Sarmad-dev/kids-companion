# Local development infrastructure.
#
#   pnpm docker:up      start
#   pnpm docker:down    stop
#   pnpm docker:logs    tail
#
# Development-only. These credentials are intentionally weak and well-known —
# they are not secrets, and nothing resembling them belongs in a deployed
# environment, where credentials come from the secret manager (SECURITY.md §5).

name: kids-companion

services:
  postgres:
    image: postgres:17-alpine
    container_name: kc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kids_companion
      # Deterministic collation so index behaviour matches across machines.
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=en-US --encoding=UTF8"
    ports:
      - "54322:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../migrations:/docker-entrypoint-initdb.d:ro
    command:
      # Log slow queries locally so an N+1 is noticed during development rather
      # than in production. See docs/DATABASE_CONVENTIONS.md §11.
      - "postgres"
      - "-c"
      - "log_min_duration_statement=200"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kids_companion"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: kc-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    # Persistence on so restarting the container does not silently reset rate
    # limits and quotas mid-debugging.
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
